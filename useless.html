<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>I warned you</title>
    <style>
        body {
            font-family: 'Courier New', Courier, monospace;
            background-color: #1e272e;
            color: white;
            text-align: center;
            padding: 20px;
            margin: 0;
        }

        h1 {
            margin-top: 50px;
            font-weight: normal;
        }

        /* Container to wrap the buttons nicely */
        #button-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
            margin-top: 40px;
            padding: 20px;
        }

        .clone-btn {
            background-color: #ff3f34;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 15px 20px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
            transition: transform 0.05s;
        }

        .clone-btn:active {
            transform: translateY(3px);
            /* Makes it feel like a real button press */
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.3);
        }
    </style>
</head>

<body>

    <h1>Please, just leave the button alone.</h1>

    <div id="button-container">
        <!-- The Original Button -->
        <button class="clone-btn" onclick="spawnButtons(this)">Do Not Click Me</button>
    </div>

    <script>
        function spawnButtons(clickedBtn) {
            // 1. Deactivate the button you just clicked
            clickedBtn.innerText = "WHY DID YOU DO THAT?!";
            clickedBtn.style.backgroundColor = "#485460"; // Turns it a dull gray
            clickedBtn.style.cursor = "default";
            clickedBtn.onclick = null; // Removes the click ability so it can't spawn more

            // 2. Spawn two new buttons
            var container = document.getElementById('button-container');

            for (let i = 0; i < 2; i++) {
                let newBtn = document.createElement("button");
                newBtn.className = "clone-btn";
                newBtn.innerText = "Do Not Click Me";

                // Give the new buttons the exact same cloning power
                newBtn.onclick = function () {
                    spawnButtons(this);
                };

                container.appendChild(newBtn);
            }
        }
    </script>

</body>

</html>
